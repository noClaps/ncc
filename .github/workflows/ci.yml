name: CI

on:
  push:

env:
  CARGO_TERM_COLOR: always

jobs:
  test:
    name: Test (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [macos-latest, ubuntu-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      # the generated C needs C23 (`<stdckdint.h>`, GCC 14+), so use the newest GCC the
      # Ubuntu release packages rather than its default one
      - name: Install the newest GCC
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          version=$(apt-cache search --names-only '^gcc-[0-9]+$' | grep -oE '^gcc-[0-9]+' | cut -d- -f2 | sort -n | tail -1)
          sudo apt-get install -y "gcc-$version"
          echo "CC=gcc-$version" >> "$GITHUB_ENV"
          "gcc-$version" --version

      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt

      - uses: Swatinem/rust-cache@v2

      - name: Format
        run: |
          cargo fmt --check
          cargo fmt --check --manifest-path tooling/zed/Cargo.toml

      - name: Clippy
        run: cargo clippy --all-targets -- -D warnings

      - name: Clippy (Zed extension)
        run: cargo clippy --manifest-path tooling/zed/Cargo.toml -- -D warnings

      - name: Test
        run: cargo test
