name: CI

on:
  push:

env:
  CARGO_TERM_COLOR: always

jobs:
  test:
    name: Test (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        # Ubuntu 26.04's default GCC (15) supports the C23 the generated code needs
        os: [macos-latest, ubuntu-26.04]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7

      - name: C compiler version
        run: cc --version

      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt

      - uses: Swatinem/rust-cache@v2

      - name: Format
        run: |
          cargo fmt --check
          cargo fmt --check --manifest-path tooling/zed/Cargo.toml

      - name: Clippy
        run: cargo clippy --all-targets -- -D warnings

      - name: Clippy (Zed extension)
        run: cargo clippy --manifest-path tooling/zed/Cargo.toml -- -D warnings

      - name: Test
        run: cargo test
