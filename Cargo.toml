[package]
name = "ncc"
version = "0.1.0"
edition = "2024"
description = "Compiler for the NC programming language"
license = "MIT"

[dependencies]
serde_json = "=1.0.150"
unicode-segmentation = "=1.12.0"
tempfile = "=3.27.0"

[[bin]]
name = "ncc"
path = "src/main.rs"

[profile.release]
lto = true
codegen-units = 1
