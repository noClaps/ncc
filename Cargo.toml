[package]
name = "ncc"
version = "0.1.0"
edition = "2024"

[[bin]]
name = "ncc"
path = "src/main.rs"

[[bench]]
name = "compilation"
harness = false

# Keep the compiler's evaluator fast in development and integration tests without
# disabling Rust debug assertions or overflow checks.
[profile.dev]
opt-level = 2

[profile.release]
lto = true
codegen-units = 1

[lints.clippy]
pedantic = { level = "warn", priority = -1 }
too_many_lines = "forbid"
needless_pass_by_value = "forbid"
struct_excessive_bools = "forbid"
case_sensitive_file_extension_comparisons = "forbid"
unicode_not_nfc = "forbid"
